# Dependabot: once a week GitHub checks every dependency of the project and opens a pull request for each update
# (security updates right away). CI runs on that pull request, so an update that breaks something is caught before
# merging. Minor and patch updates of each ecosystem come together in one pull request, to keep the noise down.
version: 2
updates:
  - package-ecosystem: maven
    directory: /
    schedule: { interval: weekly }
    groups:
      maven-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /frontend
    schedule: { interval: weekly }
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]

  # Base images of the Dockerfiles (nginx, the JRE, the build images)
  - package-ecosystem: docker
    directories: [/, /frontend]
    schedule: { interval: weekly }

  # Images of the production compose (Caddy, Prometheus, Grafana, node-exporter)
  - package-ecosystem: docker-compose
    directory: /deploy
    schedule: { interval: weekly }

  # The actions used by the workflows
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      actions:
        patterns: ["*"]
