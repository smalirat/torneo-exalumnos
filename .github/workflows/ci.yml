# Continuous integration: on every push and pull request to main, test the backend, build the frontend and
# build the Docker images. On main, the images are published to GitHub Container Registry (ghcr.io) and deployed to
# the demo server.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: # run it by hand from the Actions tab

# A newer push to a pull request cancels the run still going. On main runs wait in line instead: cancelling one in the
# middle of a deploy would leave the server half updated.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least privilege: jobs only read the code unless they say otherwise
permissions:
  contents: read

jobs:
  backend:
    name: Backend · tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven # keeps ~/.m2 between runs

      # Compiles and runs the integration tests (H2 in memory, no database or secrets needed)
      - name: Test
        run: ./mvnw -B verify

      - name: Keep the test reports if something failed
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports
          path: target/surefire-reports/

  frontend:
    name: Frontend · type check and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      # vue-tsc (type check) + vite build
      - name: Build
        run: npm run build

  images:
    name: Image · ${{ matrix.name }}
    needs: [backend, frontend] # only when the code is green
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push to ghcr.io
    strategy:
      matrix:
        include:
          - name: api
            context: .
          - name: web
            context: frontend
    steps:
      - uses: actions/checkout@v7

      # QEMU lets this (amd64) runner produce arm64 images too; Buildx is Docker's builder for multi-platform images
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }} # automatic, no secret to create

      # Tags: the commit (sha-1a2b3c4) always; "latest" only from main
      - name: Tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/torneo-${{ matrix.name }}
          tags: |
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build (and push from main)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Docker layer cache in GitHub Actions: unchanged layers are not rebuilt
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  deploy:
    name: Deploy · demo
    needs: images # the images of this commit are published
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Shows the deploys (and the link) in the repository's Environments
    environment:
      name: demo
      url: https://torneo-marianista-demo.duckdns.org
    steps:
      # The key's only power on the server is deploying a tag (forced command, deploy/deploy-ci.sh). The host key is
      # pinned: the job refuses to talk to any other machine answering at that IP.
      - name: SSH key and known host
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_SSH_HOST: ${{ vars.DEPLOY_SSH_HOST }}
        run: |
          # Say clearly what is missing (Settings → Secrets and variables → Actions) instead of a cryptic ssh error
          for name in DEPLOY_SSH_KEY DEPLOY_SSH_HOST DEPLOY_KNOWN_HOSTS; do
            [ -n "${!name}" ] || { echo "::error::$name is empty: create it in Settings → Secrets and variables → Actions"; exit 1; }
          done
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts

      # Same tag the images job published (type=sha: the first 7 characters of the commit)
      - name: Deploy this commit
        run: ssh -i ~/.ssh/deploy_key -o BatchMode=yes ubuntu@${{ vars.DEPLOY_SSH_HOST }} "sha-${GITHUB_SHA::7}"
