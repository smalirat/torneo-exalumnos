# Production: the same three services as the root docker-compose.yml, but nothing is built here. The images are the
# ones CI published to ghcr.io (amd64 + arm64), Caddy sits in front with HTTPS, and Prometheus + Grafana watch it all.
# This folder is all the server needs: copy it, create .env from .env.example and run ./deploy.sh
name: torneo-prod

# Docker keeps container logs forever by default and a small server's disk fills up: keep 3 files of 10 MB each
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# Container hardening, merged into every service (<<: *hardening). If someone takes over a container through a bug,
# these limit what they can do from there:
# - no-new-privileges: a process can never gain more privileges than it started with (setuid binaries, sudo, etc.)
# - cap_drop ALL: Linux "capabilities" are pieces of root's power (change file owners, bind ports < 1024, ...). Drop
#   them all; the few services that need one add it back by name with cap_add
# - pids_limit: a cap on processes/threads, so a runaway one (or a "fork bomb") cannot freeze the whole server
x-hardening: &hardening
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  pids_limit: 200

# Network segmentation: each service only sees the ones it talks to. Caddy (exposed to the internet) cannot reach the
# database; the database and the API have no internet access at all (internal networks), so even a compromised API
# could not download tools or send data out.
#   edge (internet)   caddy <-> web
#   app (internal)    web <-> api <- prometheus
#   data (internal)   api <-> db
#   monitoring        prometheus, node-exporter, grafana (not internal: their 127.0.0.1 ports need it)
networks:
  edge:
  app:
    internal: true
  data:
    internal: true
  monitoring:

services:
  db:
    <<: *hardening
    image: postgres:16-alpine
    restart: unless-stopped
    # The entrypoint starts as root, fixes the data folder's owner and switches to the postgres user
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETUID, SETGID]
    networks: [data]
    read_only: true          # the image cannot be modified; only the data volume and these temporary folders can
    tmpfs:
      - /var/run/postgresql
      - /tmp
    environment:
      POSTGRES_DB: football_tournament
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      # Passwords of the two users db-roles.sh creates (the owner runs migrations, the app reads and writes rows)
      DB_OWNER_PASSWORD: ${DB_OWNER_PASSWORD:?Set DB_OWNER_PASSWORD in .env}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD:?Set DB_APP_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./db-roles.sh:/docker-entrypoint-initdb.d/10-roles.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d football_tournament"]
      interval: 5s
      timeout: 5s
      retries: 10
    logging: *logging

  api:
    <<: *hardening
    image: ghcr.io/smalirat/torneo-api:${TAG:-latest}
    restart: unless-stopped
    networks: [app, data]
    read_only: true
    tmpfs:
      - /tmp                 # uploads in progress and Tomcat's work folder
    pids_limit: 400          # every Java thread counts (Tomcat alone can use 200)
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/football_tournament
      # Never the superuser: the app's user only reads and writes rows; the tables' owner only runs the migrations
      DB_USERNAME: torneo_app
      DB_PASSWORD: ${DB_APP_PASSWORD}
      DB_MIGRATION_USERNAME: torneo_owner
      DB_MIGRATION_PASSWORD: ${DB_OWNER_PASSWORD}
      APP_JWT_SECRET: ${APP_JWT_SECRET:?Set APP_JWT_SECRET in .env (32+ characters)}
      APP_ADMIN_USERNAME: ${APP_ADMIN_USERNAME:-admin}
      APP_ADMIN_PASSWORD: ${APP_ADMIN_PASSWORD:-}
      APP_CORS_ALLOWED_ORIGINS: https://${DOMAIN:?Set DOMAIN in .env}
      APP_SWAGGER_ENABLED: "false"
      # Public demo only (fictional data): a "demo" admin whose password the site shows (see demo-reset.sh)
      APP_DEMO_ENABLED: ${APP_DEMO_ENABLED:-false}
      APP_DEMO_PASSWORD: ${APP_DEMO_PASSWORD:-}
      # The image default is 75% of the RAM: fine on a big server, too much on a 1 GB one (see .env.example)
      JAVA_OPTS: ${JAVA_OPTS:--XX:MaxRAMPercentage=75}
    healthcheck:
      # A small shared CPU takes 2 minutes to start Spring Boot, and up to 7 when other containers start at the same time
      start_period: 300s
    logging: *logging

  web:
    <<: *hardening
    image: ghcr.io/smalirat/torneo-web:${TAG:-latest}
    restart: unless-stopped
    networks: [edge, app]
    read_only: true
    tmpfs:                   # owned by the nginx user (uid 101): nginx runs without root
      - /var/cache/nginx:uid=101,gid=101
      - /tmp:uid=101,gid=101
    # Started, not healthy: nginx looks the api up on each request, so the site is served while a slow api starts
    # (only /api answers 502 meanwhile) instead of waiting, and failing, with it
    depends_on:
      api:
        condition: service_started
    logging: *logging
    # No published port anymore: Caddy is the only door from the internet

  caddy:
    <<: *hardening
    image: caddy:2.11-alpine
    restart: unless-stopped
    cap_add: [NET_BIND_SERVICE]   # ports 80 and 443
    networks: [edge]
    read_only: true
    tmpfs:
      - /tmp
    depends_on:
      web:
        condition: service_healthy
    ports:
      - "80:80"         # HTTP: Let's Encrypt checks the domain here, and Caddy redirects everything else to HTTPS
      - "443:443"       # HTTPS
      - "443:443/udp"   # HTTP/3
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data       # certificates: keep them, or every restart asks Let's Encrypt again (rate limited)
      - caddy-config:/config
    logging: *logging

  # ---- Monitoring: Prometheus collects the metrics, Grafana shows them. Both only on 127.0.0.1 of the server: reach
  # them with an SSH tunnel (docs/observability.md). Memory caps keep them from starving the app on a 1 GB machine.
  prometheus:
    <<: *hardening
    image: prom/prometheus:v3.5.0
    restart: unless-stopped
    networks: [app, monitoring]
    read_only: true
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --storage.tsdb.retention.size=1GB
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    mem_limit: 192m
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:9090/-/ready"]
      interval: 15s
      timeout: 5s
      retries: 5
    logging: *logging

  # Server metrics (CPU, RAM, swap, disk, network) read from the host's /proc and /sys
  node-exporter:
    <<: *hardening
    image: prom/node-exporter:v1.12.1
    restart: unless-stopped
    networks: [monitoring]
    read_only: true
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/rootfs
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|run|var/lib/docker/.+)($$|/)
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    mem_limit: 48m
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:9100/"]
      interval: 15s
      timeout: 5s
      retries: 5
    logging: *logging

  # On demand: it takes ~90 MB of a 1 GB machine and is only looked at now and then (through the SSH tunnel), so a
  # plain "up" does not start it. Prometheus keeps collecting meanwhile, no history is lost.
  #   docker compose --profile grafana up -d grafana     # before opening the tunnel
  #   docker compose stop grafana                        # when done
  grafana:
    <<: *hardening
    profiles: [grafana]
    image: grafana/grafana-oss:12.1.1
    restart: unless-stopped
    networks: [monitoring]
    read_only: true
    tmpfs:
      - /tmp
    depends_on:
      prometheus:
        condition: service_healthy
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      # Nothing phones home or downloads plugins at startup: less memory, less outbound traffic
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 180s   # the first start creates its database, slow on a small CPU
    logging: *logging

volumes:
  db-data:
  caddy-data:
  caddy-config:
  prometheus-data:
  grafana-data:
