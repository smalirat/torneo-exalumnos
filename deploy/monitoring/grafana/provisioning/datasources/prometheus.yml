# Grafana reads this on startup: the Prometheus data source exists without clicking anything (provisioning)
apiVersion: 1
datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: 30s   # same as the scrape interval, so rate() windows are never too short
