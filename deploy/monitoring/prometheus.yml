# Prometheus asks each target for its metrics every 30 seconds ("scrape") and keeps them (30 days, at most 1 GB:
# see the flags in docker-compose.yml). Targets are reached by their compose service name, inside the Docker network.
global:
  scrape_interval: 30s
  scrape_timeout: 10s

scrape_configs:
  # Spring Boot (Actuator + Micrometer): JVM memory and GC, HTTP requests and their times, database pool
  - job_name: api
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["api:8082"]

  # The server itself: CPU (including "steal", the time the cloud host gives to other VMs), RAM, swap, disk, network
  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]

  # Prometheus' own health (memory, series, failed scrapes)
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
