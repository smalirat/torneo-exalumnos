# The whole app on one machine: `docker compose up -d --build`, then http://localhost:8080
# Settings and secrets come from .env (copy .env.example; .env is never committed).
name: torneo

# Same container hardening and network split as production (deploy/docker-compose.yml explains each line), so a
# problem they cause shows up here first and not on the server
x-hardening: &hardening
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  pids_limit: 200

networks:
  app:            # web <-> api (web also publishes its port, so this one cannot be internal)
  data:           # api <-> db, no internet access
    internal: true

services:
  db:
    <<: *hardening
    image: postgres:16-alpine
    restart: unless-stopped
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETUID, SETGID]
    networks: [data]
    read_only: true
    tmpfs: [/var/run/postgresql, /tmp]
    environment:
      POSTGRES_DB: football_tournament
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      DB_OWNER_PASSWORD: ${DB_OWNER_PASSWORD:?Set DB_OWNER_PASSWORD in .env}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD:?Set DB_APP_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./deploy/db-roles.sh:/docker-entrypoint-initdb.d/10-roles.sh:ro   # least-privilege users, see that file
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d football_tournament"]
      interval: 5s
      timeout: 5s
      retries: 10
    # No published port: only the backend reaches the database (inside the compose network)

  api:
    build: .
    image: torneo-api
    restart: unless-stopped
    <<: *hardening
    networks: [app, data]
    read_only: true
    tmpfs: [/tmp]
    pids_limit: 400
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/football_tournament
      DB_USERNAME: torneo_app
      DB_PASSWORD: ${DB_APP_PASSWORD}
      DB_MIGRATION_USERNAME: torneo_owner
      DB_MIGRATION_PASSWORD: ${DB_OWNER_PASSWORD}
      APP_JWT_SECRET: ${APP_JWT_SECRET:?Set APP_JWT_SECRET in .env (32+ characters)}
      APP_ADMIN_USERNAME: ${APP_ADMIN_USERNAME:-admin}
      APP_ADMIN_PASSWORD: ${APP_ADMIN_PASSWORD:-}
      APP_CORS_ALLOWED_ORIGINS: ${PUBLIC_URL:-http://localhost:8080}
    # No published port: the browser reaches it through the web container (/api)

  web:
    build: ./frontend
    image: torneo-web
    restart: unless-stopped
    <<: *hardening
    networks: [app]
    read_only: true
    tmpfs: ['/var/cache/nginx:uid=101,gid=101', '/tmp:uid=101,gid=101']   # nginx runs as uid 101
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-8080}:8080"

volumes:
  db-data:
