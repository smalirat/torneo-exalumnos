# Serves the built Vue app and forwards the API to the backend container ("api" in docker-compose):
# the browser only talks to this server, so there is no CORS between frontend and API.
# This file is included inside nginx's http block, so the zones and maps below are valid here.

# The visitor's real IP. In production Caddy is in front and the TCP connection comes from Caddy's container, so
# nginx takes the address from the X-Forwarded-For header that Caddy adds, but only when the connection comes from a
# private network (Docker's): nobody on the internet can fake their IP by sending that header themselves.
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

# Request limits per IP (on top of the per-username lock in the backend). Above the limit: 429 Too Many Requests.
# - auth: login, sign-up and invitations, 10 per minute (guessing passwords or creating accounts in bulk)
# - api: the rest of the API, 20 per second, with room for the bursts of a page that loads several things at once
limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
limit_req_status 429;

# Micro-cache of the public API: standings, fixtures and scorers change only when the admin loads something, so nginx
# keeps each answer fresh for 30 seconds and most visits never reach Java (the slow part on a 1 GB server). Expired
# answers are kept for 7 days: a visitor gets the last one at once while nginx asks Java for a new one in the
# background, so even after hours without visits nobody waits for a cold backend. In memory (/var/cache/nginx is a
# tmpfs in production), at most 30 MB.
proxy_cache_path /var/cache/nginx/api levels=1:2 keys_zone=public_api:2m max_size=30m inactive=7d use_temp_path=off;

# Cache-Control by path, set once at server level (an add_header inside a location would drop every header below)
map $uri $cache_control {
    ~^/assets/  "public, max-age=31536000, immutable";  # built files have a hash in their name
    ~^/api/     "";                                     # empty: not added, the backend sets its own
    default     "no-cache";                             # index.html: always check for a new version
}

server {
    listen 8080;   # not 80: nginx runs without root, and ports below 1024 need it
    server_name _;
    root /usr/share/nginx/html;

    # Request bodies: 1 MB is plenty for any JSON the app sends (a 60-player roster is a few KB). Only the file
    # uploads below get more; a bigger body is refused here (413) before it reaches the backend
    client_max_body_size 1m;
    # A client that sends its request very slowly does not hold a connection for long
    client_header_timeout 15s;
    client_body_timeout 30s;
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Security headers, on every response ("always": also on errors). They tell the browser what this site may do:
    # - CSP: scripts, styles, fonts and API calls only from this same site; images also from data:/blob: (photo
    #   previews before uploading). An injected <script> or a script from another domain would not run.
    # - frame-ancestors / X-Frame-Options: no other site can show this one inside a frame (clickjacking)
    # - nosniff: the browser uses the declared type and does not guess (an image is never run as a script)
    # - Permissions-Policy: the app never uses camera, microphone, location or payments; nothing loaded can ask
    # - COOP / CORP: other sites cannot keep a handle on this window or embed its images and data
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
    add_header Cross-Origin-Opener-Policy same-origin always;
    add_header Cross-Origin-Resource-Policy same-origin always;
    add_header Cache-Control $cache_control;

    # Look up "api" in Docker's DNS on every request (cached 10 s) instead of once at startup: when the api container is
    # recreated it gets a new IP, and a fixed "proxy_pass http://api:8081" would keep sending to the old one (502)
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api http://api:8081;

    location ~ ^/api/auth/(login|register|claim|invites/) {
        limit_req zone=auth burst=10 nodelay;
        include /etc/nginx/conf.d/api-proxy.inc;
    }

    # Excel import (admin only): reading a whole season and applying it can take minutes on a small shared CPU
    # (it took over 2 when the host gave the VM 30% of its CPU), so these two wait up to 10 minutes for an answer
    location ~ ^/api/admin/imports(/[0-9]+/apply)?$ {
        client_max_body_size 12m;
        limit_req zone=api burst=60 nodelay;
        proxy_read_timeout 600s;
        include /etc/nginx/conf.d/api-proxy.inc;
    }

    # Other file uploads: collage photos and edition images (admin), team crest (captain). The backend checks each
    # file's own limit (5 and 2 MB)
    location ~ ^/api/(admin/collage$|admin/tournaments/[0-9]+/images/|teams/[0-9]+/crest$) {
        client_max_body_size 12m;
        limit_req zone=api burst=60 nodelay;
        proxy_read_timeout 120s;
        include /etc/nginx/conf.d/api-proxy.inc;
    }

    location /api/public/ {
        limit_req zone=api burst=60 nodelay;
        proxy_read_timeout 120s;
        proxy_cache public_api;
        proxy_cache_methods GET HEAD;
        proxy_cache_valid 200 30s;
        # The backend marks every answer "no-store" (right for private data); public data is safe to keep briefly
        proxy_ignore_headers Cache-Control Expires;
        # A logged-in request (a captain looking at their team still in review) is never stored nor served from cache
        proxy_cache_bypass $http_authorization;
        proxy_no_cache $http_authorization;
        # Many visitors at once on an expired entry: one request goes to the backend, the rest wait for it
        # (no "thundering herd"); and if the backend is down or slow, the last good answer keeps being served
        proxy_cache_lock on;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_background_update on;
        include /etc/nginx/conf.d/api-proxy.inc;
    }

    location /api/ {
        limit_req zone=api burst=60 nodelay;
        proxy_read_timeout 120s;
        include /etc/nginx/conf.d/api-proxy.inc;
    }

    location /assets/ {
        try_files $uri =404;
    }

    # Vue router uses real URLs (/fixture/2026-clausura…): any other path returns index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
