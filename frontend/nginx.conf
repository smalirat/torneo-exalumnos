# Serves the built Vue app and forwards the API to the backend container ("api" in docker-compose):
# the browser only talks to this server, so there is no CORS between frontend and API.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Excel uploads and photos go up to 10 MB in the backend
    client_max_body_size 12m;
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Look up "api" in Docker's DNS on every request (cached 10 s) instead of once at startup: when the api container is
    # recreated it gets a new IP, and a fixed "proxy_pass http://api:8081" would keep sending to the old one (502)
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api http://api:8081;

    # Swagger UI, only answers when APP_SWAGGER_ENABLED=true
    location ~ ^/(swagger-ui|v3/api-docs) {
        proxy_pass $api;
        proxy_set_header Host $host;
    }

    location /api/ {
        proxy_pass $api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Built assets have a hash in their name: cache them for a year
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Vue router uses real URLs (/fixture/2026-clausura…): any other path returns index.html
    location / {
        add_header X-Content-Type-Options nosniff;
        add_header X-Frame-Options DENY;
        add_header Referrer-Policy strict-origin-when-cross-origin;
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
