# Local development without PostgreSQL: in-memory H2 in PostgreSQL mode, schema from the same
# Flyway migrations. Data is lost on restart.
# Run: ./mvnw spring-boot:run -Dspring-boot.run.profiles=dev   (APP_JWT_SECRET still required)
spring.datasource.url=jdbc:h2:mem:football_dev;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.show-sql=false

# Dev-only admin (H2 in memory); overridable with APP_ADMIN_PASSWORD
app.bootstrap.admin-password=${APP_ADMIN_PASSWORD:admin123}

# Swagger UI at /swagger-ui.html (disabled in the other profiles)
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
