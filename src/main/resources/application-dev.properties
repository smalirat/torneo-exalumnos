# Local development without MySQL: in-memory H2, data is lost on restart.
# Run: ./mvnw spring-boot:run -Dspring-boot.run.profiles=dev   (APP_JWT_SECRET still required)
spring.datasource.url=jdbc:h2:mem:football_dev;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Dev-only admin (H2 in memory); overridable with APP_ADMIN_PASSWORD
app.bootstrap.admin-password=${APP_ADMIN_PASSWORD:admin123}
