spring.application.name=Football_Tournament_Management_System

server.port=8081

# PostgreSQL (local or Supabase). For Supabase use the Session pooler connection string, e.g.
# DB_URL=jdbc:postgresql://aws-0-<region>.pooler.supabase.com:5432/postgres?sslmode=require
# DB_USERNAME=postgres.<project-ref>
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/football_tournament}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
# Free Postgres plans allow few connections: keep the pool small
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}

# The schema is owned by Flyway (src/main/resources/db/migration); Hibernate only checks it matches the entities
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

springdoc.swagger-ui.path=/swagger-ui.html

# JWT: the secret must come from the environment (at least 32 chars). Never commit a real one.
app.jwt.secret=${APP_JWT_SECRET}
app.jwt.expiration-minutes=180

# CORS: comma-separated list of allowed frontend origins
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Initial admin user, created on startup only if no user with that name exists.
# If APP_ADMIN_PASSWORD is empty, no admin is created.
app.bootstrap.admin-username=${APP_ADMIN_USERNAME:admin}
app.bootstrap.admin-password=${APP_ADMIN_PASSWORD:}
