spring.application.name=Football_Tournament_Management_System

server.port=8081

# PostgreSQL (local or Supabase). For Supabase use the Session pooler connection string, e.g.
# DB_URL=jdbc:postgresql://aws-0-<region>.pooler.supabase.com:5432/postgres?sslmode=require
# DB_USERNAME=postgres.<project-ref>
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/football_tournament}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
# Free Postgres plans allow few connections: keep the pool small
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}

# The schema is owned by Flyway (src/main/resources/db/migration); Hibernate only checks it matches the entities
spring.flyway.enabled=true
# Migrations may run as a different, more powerful user than the app (deploy/db-roles.sh): the owner of the tables
# creates and changes them, the app user only reads and writes rows. Without these, Flyway uses the app's user
spring.flyway.user=${DB_MIGRATION_USERNAME:${spring.datasource.username}}
spring.flyway.password=${DB_MIGRATION_PASSWORD:${spring.datasource.password}}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

springdoc.swagger-ui.path=/swagger-ui.html
# API docs off by default (they would map every endpoint for an attacker); on in dev or with APP_SWAGGER_ENABLED=true
springdoc.api-docs.enabled=${APP_SWAGGER_ENABLED:false}
springdoc.swagger-ui.enabled=${APP_SWAGGER_ENABLED:false}

# JWT: the secret must come from the environment (at least 32 chars). Never commit a real one.
app.jwt.secret=${APP_JWT_SECRET}
app.jwt.expiration-minutes=180

# CORS: comma-separated list of allowed frontend origins
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Initial admin user, created on startup only if no user with that name exists.
# If APP_ADMIN_PASSWORD is empty, no admin is created.
app.bootstrap.admin-username=${APP_ADMIN_USERNAME:admin}
app.bootstrap.admin-password=${APP_ADMIN_PASSWORD:}

# Public demo (fictional data): a "demo" admin, and these captains, get a known password (published in the README) so
# anyone can try the panel. Off by default; never turn it on for a league with real data (the demo is reset nightly).
app.demo.enabled=${APP_DEMO_ENABLED:false}
app.demo.username=${APP_DEMO_USERNAME:demo}
app.demo.password=${APP_DEMO_PASSWORD:}
# Comma-separated usernames of existing captains that also get the demo password
app.demo.captains=${APP_DEMO_CAPTAINS:}

# Metrics for Prometheus (/actuator/prometheus) and health, on their own port: nginx only forwards /api, so they are
# never reachable from the internet, only from inside the compose network
management.server.port=${MANAGEMENT_PORT:8082}
management.endpoints.web.exposure.include=health,prometheus
management.metrics.tags.application=torneo
# Response time buckets (a few fixed ones instead of a full histogram: fewer series for a small server)
management.metrics.distribution.slo.http.server.requests=50ms,100ms,250ms,500ms,1s,2s,5s

# Excel uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
